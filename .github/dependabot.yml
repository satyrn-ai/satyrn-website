# Weekly, one grouped pull request per ecosystem. The cooldown waits a week
# after a release before proposing it, so a compromised or broken release has
# time to be noticed and pulled first. Security updates skip the cooldown.
#
# prek.toml is not covered: Dependabot's pre-commit support only reads
# .pre-commit-config.yaml.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      uv:
        patterns: ["*"]
